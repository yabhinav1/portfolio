<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Link preview card</title>
<!-- Source of public/og.png. Re-render after editing:
     msedge --headless=new --window-size=1200,630 --screenshot=public/og.png docs/og.html
     (chrome works the same way) -->
<style>
@font-face{font-family:Inter;font-weight:400 700;src:url(../public/fonts/inter-latin.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(../public/fonts/jetbrains-mono-latin.woff2) format("woff2")}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0a0a0a;color:#f2f2f2;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased;
  padding:60px 72px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#1a1a1a 1px,transparent 1px),linear-gradient(90deg,#1a1a1a 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 80% 20%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 80% 20%,#000 20%,transparent 70%)}
.top{display:flex;justify-content:space-between;align-items:center;font:500 22px/1 "JetBrains Mono",monospace;color:#8a8a8a;position:relative}
.brand{color:#f2f2f2;font-weight:600;display:flex;gap:10px;align-items:center}
.brand i{color:#7ea2ff;font-style:normal}
.pill{display:inline-flex;align-items:center;gap:10px;border:1px solid #262626;padding:10px 16px;font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:#b8b8b8}
.dot{width:9px;height:9px;background:#16a34a;border-radius:50%;box-shadow:0 0 0 5px rgba(22,163,74,.18)}
h1{font-size:104px;line-height:.98;letter-spacing:-.045em;font-weight:700;position:relative}
h1 span{display:block;color:#8a8a8a}
.sub{font-size:26px;line-height:1.4;color:#b8b8b8;max-width:860px;margin-top:22px;position:relative}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;font:500 20px/1 "JetBrains Mono",monospace;color:#8a8a8a;position:relative}
.bottom b{color:#f2f2f2;font-weight:500}
.tags{display:flex;gap:10px}
.tags i{font-style:normal;border:1px solid #262626;padding:9px 12px;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:#b8b8b8}
</style></head>
<body>
<div class="grid"></div>
<div class="top"><span class="brand">Abhinav<i>◗</i></span><span class="pill"><span class="dot"></span>Open to new work</span></div>
<div>
  <h1>Abhinav<span>Full-stack developer</span></h1>
  <p class="sub">Builds software and keeps it running. A Discord bot in 480+ servers, an offline-first memory for field crews, a productivity OS.</p>
</div>
<div class="bottom"><span><b>yabhinav.dpdns.org</b> · Delhi, India</span><span class="tags"><i>Annie</i><i>DailyOS</i><i>FieldMind</i><i>FieldProof</i></span></div>
</body></html>
