# fly launch --no-deploy  (then edit app name below), fly volumes create data --size 1
app = "abhinav-portfolio"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  # set this to your real domain before deploying — sitemap and link previews use it
  SITE_URL = "https://abhinav-portfolio.fly.dev"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
